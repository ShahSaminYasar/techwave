<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechWave | B13 A02</title>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body class="font-inter bg-(--color-secondary) text-white">
    <!-- Header -->
    <header class="bg-(--color-primary) w-full px-4 py-4">
      <div class="container flex items-center justify-between gap-5">
        <!-- Logo -->
        <a href="#" class="text-white font-bold text-2xl">
          Tech<span class="bg-gradient-primary-text-clip leading-0">Wave</span>
        </a>

        <!-- Nav -->
        <nav
          class="flex items-center justify-center gap-8 text-white text-sm font-medium capitalize"
        >
          <a href="#" class="hover:text-(--color-accent)">About</a>
          <a href="#" class="hover:text-(--color-accent)">Episodes</a>
          <a href="#" class="hover:text-(--color-accent)">Host</a>
        </nav>

        <!-- CTA -->
        <a
          href="#"
          class="px-4 py-3 rounded-full text-sm font-semibold flex items-center justify-center gap-1 bg-gradient-primary text-white hover:scale-[90%] hover:shadow-[0px_0px_30px_#f708b6] active:scale-[85%] duration-300"
        >
          Subscribe <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </header>

    <!-- Main -->
    <main>
      <!-- Hero Section -->
      <section
        class="section bg-[url('./assets/hero-bg.png')] bg-cover bg-no-repeat bg-center"
        style="padding-top: 100px"
      >
        <div class="container flex flex-col items-center justify-center gap-10">
          <!-- Hero Img -->
          <div
            class="bg-[url('./assets/hero-circle.png')] bg-center bg-contain bg-no-repeat w-[350px] aspect-square p-16 grid place-items-center"
          >
            <img
              src="./assets/microphone.png"
              alt="Microphone"
              class="h-full"
            />
          </div>

          <!-- Content -->
          <div class="text-center">
            <h1 class="text-[60px] font-extrabold">TechWave</h1>
            <p class="text-sm text-white/80 mb-6">
              Your daily dose of tech insights, productivity hacks, and personal
              growth
            </p>
            <div class="flex gap-2 items-center justify-center">
              <a
                href="#"
                class="px-4 py-3 rounded-[10000000px] text-sm font-semibold flex items-center justify-center gap-1 bg-gradient-primary text-white hover:scale-[104%] hover:shadow-[0px_0px_30px_#f708b6] active:scale-[97%] duration-300"
              >
                <i class="fa-brands fa-spotify"></i> Listen on spotify
              </a>

              <a
                href="#"
                class="px-4 py-2.5 rounded-full text-sm font-semibold flex items-center justify-center gap-1 bg-transparent text-(--color-accent) border border-(--color-accent) hover:bg-(--color-accent) hover:text-(--color-primary)"
              >
                <i class="fa-regular fa-envelope"></i> Subscribe
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer></footer>
  </body>
</html>
